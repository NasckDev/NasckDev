<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3178c6"/><stop offset="100%" stop-color="#61dafb"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="289" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="32" y="38" fill="#e6edf3" font-size="16" font-weight="700">Trajetória</text>
  <text x="868" y="38" text-anchor="end" fill="#8b949e" font-size="12">2020 → hoje</text>

  <!-- trilho -->
  <line x1="70" y1="150" x2="830" y2="150" stroke="#21262d" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="150" x2="830" y2="150" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-dasharray="760" stroke-dashoffset="760">
    <animate attributeName="stroke-dashoffset" from="760" to="0" begin="0.3s" dur="1.8s" fill="freeze"/>
  </line>

  <!-- nó 1: Partners Digital -->
  <g>
    <circle cx="110" cy="150" r="0" fill="#0d1117" stroke="#8b949e" stroke-width="3">
      <animate attributeName="r" from="0" to="9" begin="0.4s" dur="0.4s" fill="freeze"/>
    </circle>
    <g opacity="0" text-anchor="middle">
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.5s" fill="freeze"/>
      <text x="110" y="190" fill="#8b949e" font-size="11">ago/2020 – fev/2021</text>
      <text x="110" y="210" fill="#e6edf3" font-size="13" font-weight="700">Partners Digital</text>
      <text x="110" y="228" fill="#8b949e" font-size="11">Estágio · SAP C4C</text>
    </g>
  </g>

  <!-- nó 2: EY início -->
  <g>
    <circle cx="300" cy="150" r="0" fill="#0d1117" stroke="#f2c94c" stroke-width="3">
      <animate attributeName="r" from="0" to="9" begin="0.9s" dur="0.4s" fill="freeze"/>
    </circle>
    <g opacity="0" text-anchor="middle">
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.5s" fill="freeze"/>
      <text x="300" y="72" fill="#8b949e" font-size="11">fev/2021 – jul/2023</text>
      <text x="300" y="92" fill="#f2c94c" font-size="13" font-weight="700">EY · Trainee → Júnior</text>
      <text x="300" y="110" fill="#8b949e" font-size="11">SAP Commerce · C# · front-end</text>
    </g>
  </g>

  <!-- nó 3: EY / Vivo -->
  <g>
    <circle cx="530" cy="150" r="20" fill="#f2c94c" opacity="0" filter="url(#soft)">
      <animate attributeName="opacity" values="0;0.35;0.15" begin="1.5s" dur="1.2s" fill="freeze"/>
    </circle>
    <circle cx="530" cy="150" r="0" fill="#0d1117" stroke="#f2c94c" stroke-width="3">
      <animate attributeName="r" from="0" to="11" begin="1.4s" dur="0.4s" fill="freeze"/>
    </circle>
    <g opacity="0" text-anchor="middle">
      <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.5s" fill="freeze"/>
      <text x="530" y="190" fill="#8b949e" font-size="11">jul/2023 – ago/2025</text>
      <text x="530" y="210" fill="#f2c94c" font-size="13" font-weight="700">EY → projeto Vivo (Telefônica)</text>
      <text x="530" y="228" fill="#c9d1d9" font-size="11">Software Engineer Front-End &amp; Microsserviços</text>
      <text x="530" y="246" fill="#8b949e" font-size="11">React · Angular · Vue/Nuxt · Node.js · NestJS · Jenkins · ArgoCD</text>
    </g>
  </g>

  <!-- nó 4: MindMiners -->
  <g>
    <circle cx="740" cy="150" r="22" fill="#a371f7" opacity="0" filter="url(#soft)">
      <animate attributeName="opacity" values="0;0.45;0.2" begin="2.1s" dur="1.2s" fill="freeze"/>
    </circle>
    <circle cx="740" cy="150" r="0" fill="#a371f7" stroke="#0d1117" stroke-width="3">
      <animate attributeName="r" from="0" to="12" begin="2.0s" dur="0.4s" fill="freeze"/>
    </circle>
    <circle cx="740" cy="150" r="12" fill="none" stroke="#a371f7" stroke-width="2" opacity="0">
      <animate attributeName="r" values="12;26" begin="2.5s" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" begin="2.5s" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <g opacity="0" text-anchor="middle">
      <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.5s" fill="freeze"/>
      <text x="740" y="72" fill="#8b949e" font-size="11">ago/2025 – atual · remoto</text>
      <text x="740" y="92" fill="#a371f7" font-size="13" font-weight="700">MindMiners</text>
      <text x="740" y="110" fill="#c9d1d9" font-size="11">Software Engineer Front-End</text>
      <text x="740" y="128" fill="#8b949e" font-size="11">React · TypeScript · Design System · IA</text>
    </g>
  </g>
</svg>
