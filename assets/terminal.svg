<svg xmlns="http://www.w3.org/2000/svg" width="900" height="412" viewBox="0 0 900 412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
  <defs>
    <clipPath id="c1"><rect x="40" y="70" height="24" width="0"><animate attributeName="width" from="0" to="820" begin="0.4s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="136" height="24" width="0"><animate attributeName="width" from="0" to="820" begin="1.9s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="248" height="24" width="0"><animate attributeName="width" from="0" to="820" begin="4.9s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="304" height="24" width="0"><animate attributeName="width" from="0" to="820" begin="6.8s" dur="0.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- janela -->
  <rect x="0.5" y="0.5" width="899" height="411" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="899" height="40" rx="14" fill="#161b22"/>
  <rect x="0.5" y="26" width="899" height="15" fill="#161b22"/>
  <line x1="0.5" y1="41" x2="899.5" y2="41" stroke="#30363d"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="21" r="6" fill="#febc2e"/>
  <circle cx="64" cy="21" r="6" fill="#28c840"/>
  <text x="450" y="26" text-anchor="middle" fill="#8b949e" font-size="13">alexandre@nasckdev — ~/carreira</text>

  <!-- 1: whoami -->
  <g clip-path="url(#c1)">
    <text x="40" y="88"><tspan fill="#7ee787">➜</tspan><tspan fill="#e6edf3" dx="10">whoami</tspan></text>
  </g>
  <text x="40" y="116" fill="#c9d1d9" opacity="0">Alexandre Diogo Lopes Nascimento · <tspan fill="#58a6ff" font-weight="700">Senior Front-End Engineer</tspan> · São Paulo, BR
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.4s" fill="freeze"/>
  </text>

  <!-- 2: experiência -->
  <g clip-path="url(#c2)">
    <text x="40" y="154"><tspan fill="#7ee787">➜</tspan><tspan fill="#e6edf3" dx="10">cat experiencia.txt</tspan></text>
  </g>
  <g fill="#c9d1d9">
    <text x="40" y="182" opacity="0"><tspan fill="#8b949e">6 anos</tspan> construindo produtos digitais que precisam funcionar em escala
      <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="40" y="206" opacity="0"><tspan fill="#a371f7" font-weight="700">MindMiners</tspan>  SaaS de inteligência de mercado · React + TypeScript · Design System · IA
      <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="40" y="230" opacity="0"><tspan fill="#f2c94c" font-weight="700">EY → Vivo</tspan>   Front-end + microsserviços · React, Angular, Vue, Node.js, NestJS
      <animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.4s" fill="freeze"/>
    </text>
  </g>

  <!-- 3: especialidade -->
  <g clip-path="url(#c3)">
    <text x="40" y="266"><tspan fill="#7ee787">➜</tspan><tspan fill="#e6edf3" dx="10">cat especialidade.txt</tspan></text>
  </g>
  <text x="40" y="294" fill="#c9d1d9" opacity="0">Design Systems · Micro frontends · Performance · Acessibilidade · Feature flags · CI/CD
    <animate attributeName="opacity" from="0" to="1" begin="6.0s" dur="0.4s" fill="freeze"/>
  </text>

  <!-- 4: status -->
  <g clip-path="url(#c4)">
    <text x="40" y="322"><tspan fill="#7ee787">➜</tspan><tspan fill="#e6edf3" dx="10">status --disponivel</tspan></text>
  </g>
  <text x="40" y="350" opacity="0"><tspan fill="#3fb950" font-weight="700">✔</tspan><tspan fill="#c9d1d9" dx="8">Aberto a vagas</tspan><tspan fill="#3fb950" font-weight="700" dx="6">Senior Front-End</tspan><tspan fill="#c9d1d9" dx="6">· remoto ou híbrido em SP</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="7.8s" dur="0.4s" fill="freeze"/>
  </text>

  <!-- prompt final com cursor -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="8.4s" dur="0.2s" fill="freeze"/>
    <text x="40" y="386"><tspan fill="#7ee787">➜</tspan></text>
    <rect x="62" y="373" width="9" height="17" fill="#e6edf3">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="8.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
