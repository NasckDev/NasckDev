# Card de métricas (lowlighter/metrics). Precisa de um secret METRICS_TOKEN:
# Settings → Developer settings → Personal access tokens (classic) → escopos: public_repo, read:user
# Depois: Settings do repo NasckDev/NasckDev → Secrets → Actions → METRICS_TOKEN
name: Metrics
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write }
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NasckDev
          filename: github-metrics.svg
          template: classic
          base: header, activity, repositories
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_limit: 6
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_lines: yes
          plugin_calendar: no
          config_display: large
